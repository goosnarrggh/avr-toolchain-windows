name: Build Toolchain Image

on:
  push:
    branches: [ main ]  # Triggers when you push to the main branch
  pull_request:         # Triggers when you open a PR
  workflow_dispatch:    # Adds a "Run workflow" button in the GitHub UI for manual testing

jobs:
  build-windows-image:
    runs-on: windows-2022  # Uses a Windows VM to build the Windows container
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker for Windows
        shell: powershell
        run: |
          # Install the Windows Container feature if not already present
          Install-WindowsFeature -Name Containers
          
          # Force start the Docker service
          Start-Service docker
          
          # Verification: Ensure Docker is looking at Windows
          docker version

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/avr-toolchain-windows:latest .

      - name: Verify Toolchain
        run: |
          # Run a quick check to make sure the image actually works
          docker run --rm ghcr.io/${{ github.repository_owner }}/avr-toolchain-windows:latest avr-gcc --version
          docker run --rm ghcr.io/${{ github.repository_owner }}/avr-toolchain-windows:latest avr-as --version
          docker run --rm ghcr.io/${{ github.repository_owner }}/avr-toolchain-windows:latest avr-ld --version
          docker run --rm ghcr.io/${{ github.repository_owner }}/avr-toolchain-windows:latest cmake --version
          docker run --rm ghcr.io/${{ github.repository_owner }}/avr-toolchain-windows:latest ninja --version
          docker run --rm ghcr.io/${{ github.repository_owner }}/avr-toolchain-windows:latest mingw32-make --version
          docker run --rm ghcr.io/${{ github.repository_owner }}/avr-toolchain-windows:latest srec_cat --version
      - name: Sample Build
        run: |
          docker run --rm `
            -v "${{ github.workspace }}\tests\hello:C:\hello" `
            ghcr.io/${{ github.repository_owner }}/avr-toolchain-windows:latest `
            "cmake -S C:\hello -B C:\smoke\build -G Ninja -DCMAKE_TOOLCHAIN_FILE=C:\hello\avr-toolchain.cmake && cmake --build C:\hello\build"

      - name: Push Image
        # Only push to the registry if the build is on the main branch
        if: github.ref == 'refs/heads/main'
        run: docker push ghcr.io/${{ github.repository_owner }}/avr-toolchain-windows:latest
